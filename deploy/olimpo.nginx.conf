# Reverse proxy para el contenedor "web" (streamlit en 127.0.0.1:8501).
# Copiar a /etc/nginx/sites-available/olimpo, symlink en sites-enabled,
# reemplazar tu-dominio.com y correr certbot --nginx -d tu-dominio.com.

server {
    listen 80;
    server_name tu-dominio.com;

    # Default de nginx es 1M — muy poco para el file_uploader de Streamlit
    # (CSV de whitelist, módulos .py, sonidos, bases de datos). Debe cubrir
    # el server.maxUploadSize de Streamlit (200MB por defecto si no se fija).
    client_max_body_size 200M;

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
