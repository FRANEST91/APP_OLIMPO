services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Fuerza la DB dentro del volumen persistente, sin importar lo que
      # diga .env — si no, un `docker compose up` sin este override podría
      # crear la DB en /app (se pierde al reconstruir la imagen).
      OLIMPO_DB_PATH: /app/data/olimpo.db
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - olimpo_data:/app/data
      - ./external_modules:/app/external_modules
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0
    # Streamlit abre una conexión SQLite nueva por consulta (get_conn()) y
    # sirve sus propios estáticos por proceso; en una sesión larga con el
    # fragment de Anuncios pidiendo cada 5s, el límite por defecto del
    # contenedor (1024) se agota tras un par de días y truena con
    # "Too many open files" — para estáticos y para sqlite3.connect() por
    # igual, sin distinción. Subir el límite no arregla una fuga si la
    # hubiera, pero le da mucho más margen antes de repetirse.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      OLIMPO_DB_PATH: /app/data/olimpo.db
    volumes:
      - olimpo_data:/app/data
      - ./external_modules:/app/external_modules
    command: python bot_auth.py
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

volumes:
  olimpo_data:
